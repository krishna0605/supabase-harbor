name: production health

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health:
    if: ${{ vars.PRODUCTION_HEALTHCHECK_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check public readiness endpoint
        env:
          HEALTHCHECK_URL: ${{ vars.PRODUCTION_HEALTHCHECK_URL }}
        run: |
          case "$HEALTHCHECK_URL" in
            https://*) ;;
            *) echo "PRODUCTION_HEALTHCHECK_URL must use HTTPS"; exit 1 ;;
          esac
          curl --fail --silent --show-error \
            --max-time 15 \
            --retry 2 \
            --retry-all-errors \
            "${HEALTHCHECK_URL%/}/api/healthz"
