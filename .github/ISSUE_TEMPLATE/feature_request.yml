name: Feature request
description: Propose a focused improvement to Supabase Harbor.
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow or limitation should this solve?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true

  - type: textarea
    id: security
    attributes:
      label: Security and privacy implications
      description: Note any changes to credentials, permissions, network exposure, or upstream writes.
    validations:
      required: true

  - type: dropdown
    id: edition
    attributes:
      label: Target edition
      options:
        - Local edition
        - Planned cloud edition
        - Both
    validations:
      required: true
